<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101820" />
  <title>ZORVANTA — Command Center</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #101820; background: #f4f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 15% 10%, #e6ecf1 0, transparent 34rem), #f4f7fa; }
    button, input { font: inherit; }
    .topbar { background: #101820; color: white; padding: 1rem clamp(1rem, 5vw, 4rem); display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .brand { display: flex; align-items: center; gap: .75rem; font-weight: 800; letter-spacing: .2em; }
    .brand-mark { width: 2.5rem; height: 2.5rem; border-radius: .75rem; display: grid; place-items: center; color: #101820; background: white; letter-spacing: 0; }
    .tagline { display: block; color: #a7b8c7; font-size: .72rem; font-weight: 400; letter-spacing: .04em; margin-top: .2rem; }
    main { width: min(100% - 2rem, 68rem); margin: clamp(2rem, 7vh, 5rem) auto; }
    .panel { background: white; border: 1px solid #e2e8f0; border-radius: 1.25rem; box-shadow: 0 12px 35px #10182012; padding: clamp(1.25rem, 4vw, 2.5rem); }
    .auth-panel { width: min(100%, 30rem); margin: 0 auto; }
    h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: -.04em; }
    .muted { color: #64748b; line-height: 1.6; }
    form { display: grid; gap: 1rem; margin-top: 1.5rem; }
    label { display: grid; gap: .45rem; color: #101820; font-size: .875rem; font-weight: 650; }
    input { width: 100%; padding: .8rem .9rem; border: 1px solid #cbd5e1; border-radius: .7rem; background: #f8fafc; color: #101820; }
    input:focus { outline: 3px solid #38bdf833; border-color: #0284c7; }
    button { border: 0; border-radius: .7rem; background: #101820; color: white; font-weight: 700; padding: .85rem 1rem; cursor: pointer; }
    button:hover { background: #243746; }
    button:disabled { opacity: .65; cursor: wait; }
    .status { min-height: 1.5rem; margin: .9rem 0 0; font-size: .875rem; }
    .status.error { color: #b91c1c; }
    .status.success { color: #047857; }
    .dashboard { display: none; }
    .dashboard-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
    .dashboard-heading button { padding: .6rem .9rem; background: #e6ecf1; color: #101820; }
    .dashboard-heading button:hover { background: #cbd5e1; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
    .metric { padding: 1.25rem; border: 1px solid #e2e8f0; border-radius: 1rem; background: #f8fafc; }
    .metric-label { color: #64748b; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .metric-value { margin-top: .7rem; font-size: clamp(1.6rem, 4vw, 2.3rem); font-weight: 800; letter-spacing: -.04em; overflow-wrap: anywhere; }
    @media (max-width: 640px) { .metrics { grid-template-columns: 1fr; } .dashboard-heading { flex-direction: column; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">Z</span><span>ZORVANTA<span class="tagline">Intelligence. Simplified.</span></span></div>
    <span class="tagline">Command Center</span>
  </header>

  <main>
    <section id="auth-panel" class="panel auth-panel" aria-labelledby="login-title">
      <h1 id="login-title">Sign in to your workspace</h1>
      <p class="muted">Use your account credentials to access live dashboard data.</p>
      <form id="login-form">
        <label for="login-email">Work email
          <input id="login-email" name="email" type="email" autocomplete="username" placeholder="you@company.com" required />
        </label>
        <label for="login-password">Password
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
        </label>
        <button id="login-button" type="submit">Sign in</button>
      </form>
      <p id="auth-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="dashboard" class="panel dashboard" aria-labelledby="dashboard-title">
      <div class="dashboard-heading">
        <div>
          <h1 id="dashboard-title">Command Center</h1>
          <p class="muted">Live metrics from your ZORVANTA workspace.</p>
        </div>
        <button id="sign-out-button" type="button">Sign out</button>
      </div>
      <div class="metrics" aria-live="polite">
        <article class="metric"><div class="metric-label">Total users</div><div id="metric-total-users" class="metric-value">—</div></article>
        <article class="metric"><div class="metric-label">Active projects</div><div id="metric-active-projects" class="metric-value">—</div></article>
        <article class="metric"><div class="metric-label">Revenue</div><div id="metric-revenue" class="metric-value">—</div></article>
      </div>
      <p id="dashboard-status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const API_BASE_URL = 'https://zovanta-api-1.onrender.com';
      const TOKEN_KEY = 'zorvanta_auth_token';
      const authPanel = document.getElementById('auth-panel');
      const dashboard = document.getElementById('dashboard');
      const form = document.getElementById('login-form');
      const loginButton = document.getElementById('login-button');
      const authStatus = document.getElementById('auth-status');
      const dashboardStatus = document.getElementById('dashboard-status');

      function setStatus(element, message, type = '') {
        element.textContent = message;
        element.className = `status${type ? ` ${type}` : ''}`;
      }

      function showDashboard(isVisible) {
        authPanel.style.display = isVisible ? 'none' : 'block';
        dashboard.style.display = isVisible ? 'block' : 'none';
      }

      async function readJson(response) {
        let data;
        try {
          data = await response.json();
        } catch {
          throw new Error('The server returned an invalid response.');
        }
        if (!response.ok) {
          throw new Error(data.detail || data.message || `Request failed (${response.status}).`);
        }
        return data;
      }

      async function loadDashboard(token) {
        setStatus(dashboardStatus, 'Loading live dashboard data…');
        try {
          const response = await fetch(`${API_BASE_URL}/api/dashboard`, {
            method: 'GET',
            headers: {
              Accept: 'application/json',
              Authorization: `Bearer ${token}`
            }
          });
          const data = await readJson(response);
          if (data.status !== 'success' || !data.metrics || typeof data.metrics !== 'object') {
            throw new Error('Dashboard response did not include the expected metrics.');
          }

          const metrics = data.metrics;
          document.getElementById('metric-total-users').textContent = metrics.totalUsers ?? '—';
          document.getElementById('metric-active-projects').textContent = metrics.activeProjects ?? '—';
          document.getElementById('metric-revenue').textContent = metrics.revenue ?? '—';
          setStatus(dashboardStatus, 'Dashboard data updated.', 'success');
        } catch (error) {
          if (error instanceof TypeError) {
            setStatus(dashboardStatus, 'Could not reach the API. Check your connection and backend CORS settings.', 'error');
          } else {
            setStatus(dashboardStatus, error.message || 'Unable to load dashboard data.', 'error');
          }
          if (/401|403|unauthorized|forbidden/i.test(error.message || '')) {
            sessionStorage.removeItem(TOKEN_KEY);
            showDashboard(false);
            setStatus(authStatus, 'Your session has expired. Please sign in again.', 'error');
          }
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        setStatus(authStatus, 'Signing in…');
        loginButton.disabled = true;

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        try {
          const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
            method: 'POST',
            headers: {
              Accept: 'application/json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
          });
          const data = await readJson(response);
          if (data.success !== true || typeof data.token !== 'string' || !data.token) {
            throw new Error(data.message || 'The login response did not include a valid token.');
          }

          // sessionStorage limits token persistence to this browser tab session.
          sessionStorage.setItem(TOKEN_KEY, data.token);
          document.getElementById('login-password').value = '';
          showDashboard(true);
          setStatus(authStatus, '');
          await loadDashboard(data.token);
        } catch (error) {
          const message = error instanceof TypeError
            ? 'Could not reach the API. Check your connection and backend CORS settings.'
            : (error.message || 'Sign-in failed. Please try again.');
          setStatus(authStatus, message, 'error');
        } finally {
          loginButton.disabled = false;
        }
      });

      document.getElementById('sign-out-button').addEventListener('click', () => {
        sessionStorage.removeItem(TOKEN_KEY);
        document.getElementById('metric-total-users').textContent = '—';
        document.getElementById('metric-active-projects').textContent = '—';
        document.getElementById('metric-revenue').textContent = '—';
        setStatus(dashboardStatus, '');
        setStatus(authStatus, 'You have signed out.');
        showDashboard(false);
      });

      // Restore the authenticated view for an existing tab session and refresh its metrics.
      const token = sessionStorage.getItem(TOKEN_KEY);
      if (token) {
        showDashboard(true);
        loadDashboard(token);
      }
    })();
  </script>
</body>
</html>
